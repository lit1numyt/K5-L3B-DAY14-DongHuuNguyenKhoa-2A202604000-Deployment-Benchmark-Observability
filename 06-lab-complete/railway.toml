# Railway — build bằng Dockerfile, PORT do Railway cấp (CMD dùng ${PORT:-8000}).
# Secret (AGENT_API_KEY) và REDIS_URL đặt bằng `railway variables`, không ghi ở đây.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
