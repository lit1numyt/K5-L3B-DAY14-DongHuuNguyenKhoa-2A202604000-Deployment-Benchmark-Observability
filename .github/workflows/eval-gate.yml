# Quality gate: chặn merge nếu agent v2 tụt accuracy hoặc có regression so với baseline.
# run_eval.py trả exit code 1 khi accuracy < --min-accuracy hoặc có câu bị regression
# → step fail → job fail → branch protection ("Require status checks") chặn nút Merge.
name: eval-gate

on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/develop/**"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start agent v2
        run: |
          AGENT_VERSION=v2 PORT=8002 MOCK_ERROR_RATE=0 nohup python app.py > agent.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8002/health && exit 0; sleep 1; done
          cat agent.log; exit 1

      - name: Eval quality gate (exit code != 0 → block merge)
        run: |
          python eval/run_eval.py --url http://localhost:8002 \
            --min-accuracy 1.0 \
            --baseline reports/eval_v2_fixed.json \
            --out reports/eval_ci.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: 06-lab-complete/benchmark-observability/develop/reports/eval_ci.json
